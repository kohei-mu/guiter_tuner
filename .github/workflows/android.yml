name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Run unit tests
        run: ./gradlew test
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Add build timestamp to APK filename
        run: |
          timestamp="$(date -u +'%Y%m%d-%H%M%S')"
          apk_name="guiter-tuner-${timestamp}-debug.apk"
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${apk_name}"
          echo "APK_NAME=${apk_name}" >> "$GITHUB_ENV"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: app/build/outputs/apk/debug/${{ env.APK_NAME }}
